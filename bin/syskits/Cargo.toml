[package]
name = "syskits"
version = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
homepage = { workspace = true }
keywords = { workspace = true }
categories = { workspace = true }
edition = { workspace = true }
description = "CTyunOS implemented as universal utils, written in Rust"
repository = "https://atomgit.com/openeuler/syskits" 
default-run = "syskits"
readme = "../../../README.md"
rust-version = { workspace = true }

[features]
default = ["feat_common_core"]
# data pipeline rollback / staged release flags
feat_data_pipeline = [
  "cmd_from",
  "cmd_parse",
  "cmd_get",
  "cmd_select",
  "cmd_where",
  "cmd_sort_by",
  "cmd_group_by",
  "cmd_agg",
  "cmd_to",
  "cmd_assert",
  "cmd_wait_until",
  "cmd_retry",
  "cmd_date",
  "cmd_cksum",
  "cmd_df",
  "cmd_du",
  "cmd_expr",
  "cmd_factor",
  "cmd_hashsum",
  "cmd_http",
  "cmd_id",
  "cmd_dir",
  "cmd_dircolors",
  "cmd_ls",
  "cmd_pathchk",
  "cmd_ps",
  "cmd_seq",
  "cmd_stat",
  "cmd_sum",
  "cmd_arch",
  "cmd_groups",
  "cmd_hostname",
  "cmd_hostid",
  "cmd_logname",
  "cmd_nproc",
  "cmd_printenv",
  "cmd_pinky",
  "cmd_pwd",
  "cmd_run_external",
  "cmd_tty",
  "cmd_stty",
  "cmd_uname",
  "cmd_uptime",
  "cmd_users",
  "cmd_wc",
  "cmd_who",
  "cmd_whoami",
  "cmd_tsort",
  "cmd_tac",
  "cmd_tee",
  "cmd_paste",
  "cmd_expand",
  "cmd_unexpand",
  "cmd_fold",
  "cmd_nl",
  "cmd_comm",
  "cmd_join",
  "cmd_ptx",
  "cmd_shuf",
  "cmd_od",
  "cmd_tr",
  "cmd_cut",
  "cmd_cat",
  "cmd_tail",
  "cmd_head",
  "cmd_uniq",
  "cmd_sort",
  "cmd_base32",
  "cmd_base64",
  "cmd_basenc",
  "cmd_basename",
  "cmd_dirname",
  "cmd_echo",
  "cmd_env",
  "cmd_more",
  "cmd_readlink",
  "cmd_realpath",
  "cmd_fmt",
  "cmd_pr",
  "cmd_printf",
  "cmd_numfmt",
  "cmd_vdir",
  "ctrepl",
]
feat_data_workflow = ["feat_data_pipeline", "ctengine/workflow"]
feat_data_plugin = ["feat_data_pipeline", "ctplugin"]
feat_data_experimental = ["feat_data_pipeline"]
feat_typed_cmds = [
  "feat_data_pipeline",
  "ls/feat_typed_cmds",
  "env/feat_typed_cmds",
  "df/feat_typed_cmds",
  "uname/feat_typed_cmds",
  "stat/feat_typed_cmds",
]

feat_require_selinux = ["chcon", "runcon"]
feat_acl = ["cp/feat_acl", "ls/feat_acl"]
feat_selinux = [
  "cp/feat_selinux",
  "ls/feat_selinux",
  "selinux",
  "feat_require_selinux",
]

# 功能集
feat_common_core = [
  "arch",
  "base32",
  "base64",
  "basename",
  "basenc",
  "cat",
  "cksum",
  "comm",
  "cp",
  "csplit",
  "cut",
  "date",
  "dd",
  "df",
  "dir",
  "dircolors",
  "dirname",
  "du",
  "echo",
  "env",
