command_test = { optional = true, package = "ct_test", path = "../../crates/commands/test" }
walkdir.workspace = true
shell_init = { optional = true, package = "ct_shell_init", path = "../../crates/commands/shell_init" }

[dev-dependencies]
filetime = { workspace = true }
glob = { workspace = true }
libc = { workspace = true }
pretty_assertions = "1"
rand = { workspace = true }
regex = { workspace = true }
sha1 = { version = "0.10", features = ["std"] }
tempfile = { workspace = true }
time = { workspace = true, features = ["local-offset"] }
unindent = "0.2"
ctcore = { workspace = true, features = ["entries", "process", "signals"] }
walkdir = { workspace = true }
hex-literal = "0.4.1"

[target.'cfg(target_os = "linux")'.dev-dependencies]
procfs = { version = "0.16", default-features = false }
nix = { workspace = true, features = ["process", "signal", "user", "term"] }
rlimit = "0.10.1"
rand_pcg = "0.3"
xattr = { workspace = true }

[[bin]]
name = "syskits"
path = "src/main.rs" # Assuming main entry point for syskits app

[build-dependencies]
glob = "0.3"
