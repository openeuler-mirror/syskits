  "pr",
  "printenv",
  "printf",
  "ptx",
  "pwd",
  "readlink",
  "realpath",
  "rm",
  "rmdir",
  "seq",
  "shred",
  "shuf",
  "sleep",
  "sort",
  "split",
  "sum",
  "sync",
  "tac",
  "tail",
  "tee",
  "command_test",
  "touch",
  "tr",
  "true",
  "truncate",
  "tsort",
  "uname",
  "unexpand",
  "uniq",
  "unlink",
  "vdir",
  "wc",
  "whoami",
  "yes",
  "shell_init",
]

feat_common_core_unix = [
  "chgrp",
  "chmod",
  "chown",
  "chroot",
  "groups",
  "id",
  "install",
  "kill",
  "logname",
  "mkfifo",
  "mknod",
  "nice",
  "nohup",
  "pathchk",
  "runcon",
  "stat",
  "stty",
  "timeout",
  "tty",
  # depend on utmpx (requiring unix utmp/utmpx support)
  "pinky",
  "uptime",
  "users",
  "who",
  # depend on hostid (gethostid of libc)
  "hostid",
  # depend on cpp crate
  "stdbuf",
]

feat_os_unix = [
  "feat_selinux",
  "feat_common_core",
  "feat_common_core_unix",
]

feat_os_windows = ["feat_common_core"]

# OS feature shortcodes
unix = ["feat_os_unix", "feat_typed_cmds"]
windows = ["feat_os_windows"]

