[package]
name = "ct_echo"
version.workspace = true
authors.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true
homepage.workspace = true

description = "echo ~ (ctutils) display TEXT"
repository = "https://atomgit.com/openeuler/syskits/src/branch/master/crates/commands/echo"

[lib]
path = "src/echo.rs"

[dependencies]
sys-locale = { workspace = true }
rust-i18n = { workspace = true }
clap = { workspace = true }
ctcore = { workspace = true, features = ["signals"] }

[dev-dependencies]
tempfile = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }

[[bin]]
name = "echo"
path = "src/main.rs"
