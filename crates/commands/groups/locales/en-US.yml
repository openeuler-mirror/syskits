groups:
  clap: { }
  usage: groups [OPTION]... [USERNAME]...
  about: |-
    Print group memberships for each `USERNAME` or, if no `USERNAME` is specified, for
    the current process (which may differ if the groups data‐base has changed).
  quote_mark: "'"
  errors:
    real_uid: "cannot get real UID"
    effective_gid: "cannot get effective GID"
    current_process: "failed to get groups for the current process"
    group_not_found: "cannot find name for group ID %{gid}"
    user_not_found: "%{user}: no such user"
