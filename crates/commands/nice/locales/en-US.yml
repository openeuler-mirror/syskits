nice:
  errors:
    write_error: write error
    invalid_adjustment: "invalid adjustment %{value}"
    missing_command: a command must be given with an adjustment
    cannot_get_niceness: cannot get niceness
    cannot_set_niceness: cannot set niceness
  clap:
    adjustment: add N to the niceness (default is 10)
  usage: nice [OPTIONS] [COMMAND [ARGS]]
  about: |-
    Run `COMMAND` with an adjusted niceness, which affects process scheduling.
    With no `COMMAND`, print the current niceness.  Niceness values range from at
    least -20 (most favorable to the process) to 19 (least favorable to the
    process).
