sleep:
  clap:
    sleep_number: pause for NUMBER seconds
  usage: |-
    sleep NUMBER[SUFFIX]...
    sleep OPTION
  about: Pause for NUMBER seconds.
  errors:
    cannot_read_realtime_clock: cannot read realtime clock
    invalid_time_interval: invalid time interval
    missing_operand: missing operand
    try_help: "Try '%{utility_name} --help' for more information."
  after_help: |-
    Pause for NUMBER seconds.  SUFFIX may be 's' for seconds (the default),
    'm' for minutes, 'h' for hours or 'd' for days.  Unlike most implementations
    that require NUMBER be an integer, here NUMBER may be an arbitrary floating
    point number.  Given two or more arguments, pause for the amount of time
    specified by the sum of their values.
