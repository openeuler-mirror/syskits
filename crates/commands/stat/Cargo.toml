[package]
name = "ct_stat"

version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true

description = "stat ~ (ctutils) display FILE status"
repository = "https://atomgit.com/openeuler/syskits/src/branch/master/crates/commands/stat"

[lib]
path = "src/stat.rs"

[dependencies]
clap = { workspace = true }
ctcore = { workspace = true, features = ["entries", "libc", "fs", "fsext"] }
chrono = { workspace = true }
rust-i18n = { workspace = true }
sys-locale = { workspace = true }
tempfile = { workspace = true }
selinux = { workspace = true }
ctengine = { workspace = true, optional = true }
ctpipeline = { workspace = true, optional = true }
ctsig = { workspace = true, optional = true }
# 使用 rustix 获得现代 statx() 支持
rustix = { version = "1.0.7", features = ["fs"] }

[features]
feat_typed_cmds = ["ctengine", "ctpipeline", "ctsig"]

[[bin]]
name = "stat"
path = "src/main.rs"
