tac:
  clap:
    tac_before: attach the separator before instead of after
    tac_regex: interpret the sequence as a regular expression
    tac_separator: use STRING as the separator instead of newline
  errors:
    regex_search: error in regular expression search
    record_too_large: record too large
    empty_separator: separator cannot be empty
    failed_open: "failed to open %{path} for reading"
    read_error: read error
    write_error: write error
    standard_input: standard input
    temporary_file_create: failed to create temporary file
  usage: tac [OPTION]... [FILE]...
  about: Write each file to standard output, last line first.
